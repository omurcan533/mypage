<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — omurcanyilmaz.com</title>
  <meta name="description" content="Ömür Can Yılmaz kişisel sayfasına giriş">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Animated Background -->
  <div class="login-bg">
    <div class="grid-overlay"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div style="position:absolute; top:20px; right:20px; z-index:10; display:flex; gap:8px;">
     <button class="btn btn-ghost" id="lang-tr" onclick="i18n.setLang('tr')" style="padding:6px 12px; border-radius:8px;">TR</button>
     <button class="btn btn-ghost" id="lang-en" onclick="i18n.setLang('en')" style="padding:6px 12px; border-radius:8px;">EN</button>
     <button class="btn btn-ghost" id="theme-toggle" style="padding:6px 12px; border-radius:8px;">☀️ Açık Tema</button>
  </div>

  <!-- Floating Particles -->
  <div class="particles" id="particles"></div>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="login-avatar">Ö</div>
        <h1 class="login-title" data-i18n="login_welcome">Hoş Geldin</h1>
        <p class="login-subtitle" data-i18n="login_subtitle">omurcanyilmaz.com · Kişisel Alan</p>
      </div>

      <!-- Error Message -->
      <div class="error-message" id="error-msg">
        <span>⚠</span>
        <span id="error-text" data-i18n="login_error">Kullanıcı adı veya şifre hatalı.</span>
      </div>

      <!-- Form -->
      <form class="login-form" id="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username" data-i18n="login_username">Kullanıcı Adı</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              class="form-input"
              data-i18n="login_username"
              placeholder="kullanıcı adınız"
              autocomplete="username"
              required
            >
            <span class="input-icon">👤</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password" data-i18n="login_password">Şifre</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              class="form-input"
              data-i18n="login_password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <span class="input-icon">🔑</span>
            <button type="button" class="toggle-password" id="toggle-pw" aria-label="Şifreyi göster">👁</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me">
            <span data-i18n="login_remember">Beni hatırla (30 gün)</span>
          </label>
        </div>

        <button type="submit" class="login-btn" id="login-btn">
          <span class="btn-text" data-i18n="login_button">Giriş Yap →</span>
          <span class="btn-loader" data-i18n="login_loading">⟳ Giriş yapılıyor...</span>
        </button>
      </form>
    </div>

    <div class="login-footer" data-i18n="login_footer">
      &copy; 2026 Ömür Can Yılmaz · Tüm hakları saklıdır
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, redirect to home
    if (Auth.isLoggedIn()) {
      window.location.href = 'pages/home.html';
    }

    // Generate floating particles
    (function() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.cssText = `
          left: ${Math.random() * 100}%;
          width: ${2 + Math.random() * 4}px;
          height: ${2 + Math.random() * 4}px;
          animation-duration: ${6 + Math.random() * 10}s;
          animation-delay: ${-Math.random() * 15}s;
          opacity: ${0.2 + Math.random() * 0.5};
        `;
        container.appendChild(p);
      }
    })();

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', function() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      this.textContent = inp.type === 'password' ? '👁' : '🙈';
    });

    // Login form submit
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errMsg = document.getElementById('error-msg');
      const errText = document.getElementById('error-text');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember-me').checked;

      // Loading state
      btn.classList.add('loading');
      errMsg.classList.remove('show');

      // Simulate network delay for feel
      await new Promise(r => setTimeout(r, 600));

      const ok = Auth.login(username, password, remember);

      if (ok) {
        btn.style.background = 'linear-gradient(135deg, #34d399, #059669)';
        btn.querySelector('.btn-text').textContent = i18n.t('login_redirect');
        btn.classList.remove('loading');
        setTimeout(() => {
          window.location.href = 'pages/home.html';
        }, 500);
      } else {
        btn.classList.remove('loading');
        errText.textContent = i18n.t('login_error');
        errMsg.classList.add('show');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });

    // Enter key on username → focus password
    document.getElementById('username').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
